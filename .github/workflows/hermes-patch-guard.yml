name: hermes-patch-guard
# The image runs the pinned Hermes unpatched. Hermes patches are a fork tax re-paid on every Hermes
# bump, so a PR that adds or changes one needs the hermes-patch-approved label; deleting one never does.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths: ['image/hermes-patches/**']
permissions:
  contents: read
jobs:
  guard:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'hermes-patch-approved') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No added or changed Hermes patch without approval
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          grown=$(git diff --name-only --diff-filter=AMR "$BASE"...HEAD -- 'image/hermes-patches/*.patch')
          if [ -n "$grown" ]; then
            {
              echo "Hermes source patches are not allowed by default."
              echo
              echo "Added or changed under image/hermes-patches/:"
              echo "$grown"
              echo
              echo "Each patch is a fork tax re-paid on every Hermes bump. Try these first:"
              echo "  - Hermes config (config.yaml / hermes config set)"
              echo "  - plugin hooks or middleware in core/src/research_core/plugin/"
              echo "  - our own tools"
              echo "  - logging config (filters and handlers)"
              echo "  - out-of-process capture"
              echo
              echo "To pass anyway, add the hermes-patch-approved label to this PR."
              echo "Policy: this requires Rohit's approval, even though anyone with write access can apply the label."
              echo "Deleting a patch never needs the label."
            } | sed 's/^/::error::/'
            exit 1
          fi
