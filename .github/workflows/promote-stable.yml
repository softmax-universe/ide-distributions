# Promote a beta commit to stable by fast-forwarding `main` to it. The push to main runs
# release-hermes.yml with channel=stable; stable's own canary decides whether the stable pointer
# moves, exactly as it does for beta. A commit beta already built reuses its distribution-<sha> image.
name: Promote beta to stable

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Beta commit to promote. Empty promotes the head of beta.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: promote-stable
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The push token must bypass main's protection, and a push made with it (unlike one made
      # with GITHUB_TOKEN) triggers release-hermes.yml on main.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.STABLE_PROMOTION_TOKEN }}
      - name: Fast-forward main to a beta commit
        env:
          REQUESTED: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          revision=$(git rev-parse --verify "${REQUESTED:-origin/beta}^{commit}")
          echo "revision: $revision"

          if ! git merge-base --is-ancestor "$revision" origin/beta; then
            echo "::error::$revision is not on beta"
            exit 1
          fi
          if ! git merge-base --is-ancestor origin/main "$revision"; then
            echo "::error::main is not an ancestor of $revision; promotion is fast-forward only"
            exit 1
          fi
          if [ "$(git rev-parse origin/main)" = "$revision" ]; then
            echo "main is already at $revision"
            exit 0
          fi

          git push origin "$revision:refs/heads/main"
          echo "Promoted $revision to main" >> "$GITHUB_STEP_SUMMARY"
