# Promote a beta commit to stable. `main` only ever fast-forwards to a beta commit whose image the
# beta channel already released; the push to main then runs release-hermes.yml with
# channel=stable, which reuses the existing distribution-<sha> image instead of rebuilding.
name: Promote beta to stable

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Beta commit to promote. Empty promotes the newest commit with a successful beta release.
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: promote-stable
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The push token must bypass main's protection, and a push made with it (unlike one made
      # with GITHUB_TOKEN) triggers release-hermes.yml on main.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.STABLE_PROMOTION_TOKEN }}
      - name: Promote a beta-released commit to main
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          if [ -z "$REQUESTED" ]; then
            REQUESTED=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release-hermes.yml \
              --branch beta --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
            if [ -z "$REQUESTED" ]; then
              echo "::error::no successful beta release exists to promote"
              exit 1
            fi
          fi
          revision=$(git rev-parse --verify "$REQUESTED^{commit}")
          echo "revision: $revision"

          if ! git merge-base --is-ancestor "$revision" origin/beta; then
            echo "::error::$revision is not on beta"
            exit 1
          fi
          if ! git merge-base --is-ancestor origin/main "$revision"; then
            echo "::error::main is not an ancestor of $revision; promotion is fast-forward only"
            exit 1
          fi
          if [ "$(git rev-parse origin/main)" = "$revision" ]; then
            echo "main is already at $revision"
            exit 0
          fi

          # Evidence that beta released this exact commit: release-hermes.yml succeeded for it on
          # beta. That run only dispatches Metta's release; build, canary qualification and
          # promotion finish asynchronously in Metta, so they cannot be checked here. Metta keeps
          # a beta history and refuses to move an opted-out workspace to an image beta never
          # promoted.
          released=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release-hermes.yml \
            --branch beta --commit "$revision" --status success --limit 1 --json headSha --jq 'length')
          if [ "$released" = 0 ]; then
            echo "::error::no successful beta release ran for $revision; promote a commit beta released"
            exit 1
          fi

          git push origin "$revision:refs/heads/main"
          echo "Promoted $revision to main" >> "$GITHUB_STEP_SUMMARY"
