name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      core: ${{ steps.filter.outputs.core }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            core:
              - '**'
              - '!docs/**'
              - '!README.md'
              - '!.github/workflows/release-*.yml'

  unit:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.core != 'false') }}
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: IDE CI
      GIT_AUTHOR_EMAIL: ide-ci@example.invalid
      GIT_COMMITTER_NAME: IDE CI
      GIT_COMMITTER_EMAIL: ide-ci@example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run python tools/build_prompts.py --check
      - name: Prompt checks
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uv run python tools/check_prompts.py --model
      - name: Unit and scenario tests
        run: uv run pytest -q -n 4 --dist=loadfile --durations=20

  hermes:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.core != 'false') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [prepare, rebuild, lifecycle, gateway]
    container:
      # Match the pinned interpreter and patches used by the hosted image.
      image: nousresearch/hermes-agent@sha256:d27689bc6e8581ec884a7227c9101fdaebf6c853cff8859020dac14f21452b4d
      options: --user 0
    env:
      GIT_AUTHOR_NAME: IDE CI
      GIT_AUTHOR_EMAIL: ide-ci@example.invalid
      GIT_COMMITTER_NAME: IDE CI
      GIT_COMMITTER_EMAIL: ide-ci@example.invalid
      HERMES_BIN: /opt/hermes/.venv/bin/hermes
      HERMES_PYTHON: /opt/hermes/.venv/bin/python
      HERMES_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - name: Patch Hermes as image/Dockerfile does
        run: |
          for patch in "$GITHUB_WORKSPACE"/image/hermes-patches/*.patch; do
            git -C /opt/hermes apply --whitespace=nowarn "$patch"
          done
      - name: Install native PDF and audio utilities
        if: matrix.shard == 'gateway'
        run: apt-get update && apt-get install -y --no-install-recommends poppler-utils ffmpeg
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: uv sync --frozen
      - name: Install the hosted native attachment dependencies and model
        if: matrix.shard == 'gateway'
        run: bash image/install-native-attachments.sh
      - name: Tests against the installed Hermes
        run: |
          test -x "$HERMES_BIN"
          test -x "$HERMES_PYTHON"
          uv run pytest -q -m hermes core/tests/hermes --hermes-shard "$HERMES_SHARD" --durations=20

  core:
    needs: [changes, unit, hermes]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful suites when tests apply
        env:
          EVENT: ${{ github.event_name }}
          CHANGES: ${{ needs.changes.result }}
          CORE_CHANGED: ${{ needs.changes.outputs.core }}
          UNIT: ${{ needs.unit.result }}
          HERMES: ${{ needs.hermes.result }}
        run: |
          if [[ "$EVENT" == pull_request && "$CHANGES" == success && "$CORE_CHANGED" == false ]]; then
            [[ "$UNIT" == skipped && "$HERMES" == skipped ]]
          else
            [[ "$UNIT" == success && "$HERMES" == success ]]
          fi
