name: researcher
version: 1.0.0
description: Record and platform tools of an IDE Researcher, its briefing and advisory hook.
author: ide-distributions
kind: standalone
requires_hermes: ">=0.22.6"
# Kept in sync with the tool catalog by `python tools/build_prompts.py --manifests`.
provides_tools:
  - claim
  - claim_add_evidence
  - claim_write
  - directive
  - experiment
  - experiment_create
  - forum_post
  - goal
  - platform
  - settings
  - softmax_api
  - task
  - task_ask
  - task_complete
  - task_propose
  - task_propose_submission
  - task_release
  - task_wait
  - upload
  - version
  - wiki_edit
  - workspace
  - xp
provides_hooks:
  - api_request_error
  - approval_audience
  - on_session_delete
  - on_session_end
  - on_session_finalize
  - on_session_reset
  - post_api_request
  - post_tool_call
  - pre_api_request
  - pre_llm_call
  - pre_tool_call
  - transform_tool_result
